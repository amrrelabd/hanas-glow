{% extends "inventory/base.html" %}
{% block title %}Delete - Hana's Glow{% endblock %}
{% block page_title %}Delete{% endblock %}
{% block content %}
<div class="card stat-card p-4 fade-in" style="max-width: 520px;">
    <p>Are you sure you want to delete <strong>{{ object }}</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
