{% extends "inventory/base.html" %}
{% block title %}Login - Hana's Glow{% endblock %}
{% block guest_content %}
<div class="d-flex align-items-center justify-content-center vh-100" style="background:#2b2149;">
    <div class="card p-4" style="width: 340px; border: none; border-radius: 0.75rem;">
        <h4 class="text-center mb-3">✨ Hana's Glow</h4>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger py-2">Invalid username or password.</div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>
    </div>
</div>
{% endblock %}
